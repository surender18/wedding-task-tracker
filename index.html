<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Task Tracker</title>
    <style>
      :root {
        --primary: #7f5af0;
        --done: #2ecc71;
        --in-progress: #f39c12;
        --incomplete: #e74c3c;
        --text: #ffffff;
        --bg-start: #ab77e6;
        --bg-end: #a10cf1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(
          to bottom right,
          var(--bg-start),
          var(--bg-end)
        );
        padding: 30px 20px 100px;
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 2.2rem;
        margin-bottom: 30px;
        text-align: center;
        animation: fadeInDown 0.6s ease;
        color: #fff;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
      }

      #taskList {
        width: 100%;
        max-width: 700px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .task {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 0.4s ease both;
        transition: transform 0.2s ease;
      }

      .task:hover {
        transform: translateY(-4px);
      }

      .task span.title {
        font-weight: 600;
        font-size: 1.1rem;
        flex: 1;
        color: #fff;
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      select {
        padding: 6px 10px;
        border-radius: 8px;
        border: none;
        font-size: 0.95rem;
        outline: none;
        cursor: pointer;
        background-color: #ffffffcc;
        color: #333;
        transition: background-color 0.2s ease;
      }

      select:focus {
        background-color: #ffffff;
      }

      .status {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        color: #fff;
        font-weight: 600;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .done {
        background-color: var(--done);
      }
      .progress {
        background-color: var(--in-progress);
      }
      .incomplete {
        background-color: var(--incomplete);
      }

      #progressContainer {
        margin-top: 40px;
        width: 100%;
        max-width: 700px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      #progressBar {
        height: 24px;
        width: 0%;
        background-color: var(--done);
        text-align: center;
        line-height: 24px;
        color: #fff;
        font-weight: bold;
        transition: width 0.3s ease;
      }

      @media (max-width: 600px) {
        .task {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .controls {
          width: 100%;
          justify-content: space-between;
        }

        select {
          width: 100%;
        }
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <h1>💍 Wedding Task Tracker</h1>
    <div id="taskList"></div>

    <!-- Progress Bar -->
    <div id="progressContainer">
      <div id="progressBar">0%</div>
    </div>

    <script>
      const tasks = [
        "Roka / Engagement",
        "Invitation Distribution",
        "Guest List Finalization",
        "Shopping for Bride & Family",
        "House Decoration",
        "Photographer & Videographer Coordination",
        "Lighting Setup",
        "Haldi Preparation",
        "Haldi Ceremony (Bride)",
        "Mehendi Artist Booking",
        "Mehendi Function",
        "Mahila Sangeet ",
        "Stage Decoration for Sangeet",
        "DJ Setup",
        "Catering for Mehendi/Sangeet",
        "Mandap Setup",
        "Stage Setup for Jaimala",
        "Wedding Venue Decoration",
        "Lighting & Sound Check",
        "Bridal Makeup & Dressing",
        "Groom Arrival Coordination",
        "Baraat Welcome",
        "Aarti & Tilak for Groom",
       "bridal entry",
        "Jaimala Ceremony",
        "Pheras (7 Rounds)",
        "Kanyadaan",
        "Mangalsutra & Sindoor Ritual",
        "Pandit Ritual Completion",
        "Buffet Setup",
        "Starter & Snack Counters",
        "Dessert Counter",
        "Beverage Counter",
        "Chair Arrangement",
        "Tent Setup",
        "Guest Seating",
        "Water & Welcome Drink Distribution",
        "Gift Table Setup",
        "Bridal Vidaai Preparation",
        "Vidaai Ceremony",
        "Doli Departure",
        "Shagun / Gifts with Bride",
        "Cleanup of Venue",
        "Photo & Video Collection",
        "Return Gifts Distribution",
        "Reception (if planned later)",
        "Milni"
      ];

      const statuses = ["Incomplete", "In Progress", "Done"];
      const taskList = document.getElementById("taskList");
      const progressBar = document.getElementById("progressBar");

      function loadStatuses() {
        return JSON.parse(localStorage.getItem("weddingTasks")) || {};
      }

      function saveStatuses(data) {
        localStorage.setItem("weddingTasks", JSON.stringify(data));
      }

      function getStatusClass(status) {
        switch (status) {
          case "Done":
            return "done";
          case "In Progress":
            return "progress";
          case "Incomplete":
            return "incomplete";
          default:
            return "";
        }
      }

      function updateProgressBar(data) {
        const total = tasks.length;
        let doneCount = 0;
        tasks.forEach((task) => {
          if (data[task] === "Done") doneCount++;
        });
        const percent = Math.round((doneCount / total) * 100);
        progressBar.style.width = percent + "%";
        progressBar.textContent = percent + "%";
      }

      function renderTasks() {
        taskList.innerHTML = "";
        const savedStatuses = loadStatuses();
        updateProgressBar(savedStatuses);

        tasks.forEach((task, index) => {
          const currentStatus = savedStatuses[task] || "Incomplete";

          const taskCard = document.createElement("div");
          taskCard.className = "task";
          taskCard.style.animationDelay = `${index * 0.05}s`;

          const title = document.createElement("span");
          title.textContent = task;
          title.className = "title";

          const controls = document.createElement("div");
          controls.className = "controls";

          const statusSelect = document.createElement("select");
          statuses.forEach((status) => {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = status;
            if (status === currentStatus) option.selected = true;
            statusSelect.appendChild(option);
          });

          const statusTag = document.createElement("span");
          statusTag.className = `status ${getStatusClass(currentStatus)}`;
          statusTag.textContent = currentStatus;

          statusSelect.addEventListener("change", () => {
            const newStatus = statusSelect.value;
            statusTag.textContent = newStatus;
            statusTag.className = `status ${getStatusClass(newStatus)}`;
            savedStatuses[task] = newStatus;
            saveStatuses(savedStatuses);
            updateProgressBar(savedStatuses);
          });

          controls.appendChild(statusSelect);
          controls.appendChild(statusTag);

          taskCard.appendChild(title);
          taskCard.appendChild(controls);
          taskList.appendChild(taskCard);
        });
      }

      renderTasks();
    </script>
  </body>
</html>
